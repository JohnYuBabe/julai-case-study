# 把本文件里的内容合并进 johnyu.wancafu.com 的 443 server 块。
# 静态文件放在 /var/www/julai（packages/web-demo/dist 的内容）。
#
# 限速 zone 必须定义在 http 上下文；宝塔把 vhost 文件 include 在 http 里，
# 所以放在文件顶部的 server 块之前即可。若已有同名 zone，删掉这一行。

# 读写分开限速：正常浏览远低于 240 次/分；写请求单独压到 20 次/分，
# 防止单个 IP 用「报名→取消→再报名」持续制造行锁争用。
map $request_method $julai_write_key {
    default "";
    POST    $binary_remote_addr;
    DELETE  $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=julai_api:10m rate=240r/m;
limit_req_zone $julai_write_key zone=julai_write:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=julai_conn:10m;

# ---- 放进 443 server 块，位置在 `location / { return 404; }` 之前 ----

    # 缺少结尾斜杠会导致相对资源解析错误
    location = /julai {
        return 301 /julai/$is_args$args;
    }

    # 先拦敏感路径，避免被 SPA 回退当成前端路由返回 200
    location ~* ^/julai/(\.|.*\.(php|jsp|asp|aspx|env|ini|log|sql|sqlite|db|bak|old|swp|map|gz|tgz|zip|tar|pem|key|crt|ya?ml|conf|sh|py|rb)$) {
        return 404;
    }

    location = /julai/favicon.svg {
        root /var/www;
        expires 1d;
    }

    # 健康检查走真实 API（含数据库 SELECT 1）
    location = /julai/healthz {
        access_log off;
        proxy_pass http://127.0.0.1:3030/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # 演示 API：剥掉 /julai 前缀，保留 /api。
    # 演示身份是请求头、写入无登录，所以按 IP 限速，并把请求体压到很小。
    location ^~ /julai/api/ {
        limit_req zone=julai_api burst=60 nodelay;
        limit_req zone=julai_write burst=10 nodelay;
        limit_conn julai_conn 16;
        limit_req_status 429;
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:3030/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 带内容哈希的静态资源长缓存
    location ^~ /julai/assets/ {
        root /var/www;
        expires 30d;
        try_files $uri =404;

        location ~* \.(php|jsp|asp|aspx|env|ini|log|sql|sqlite|db|bak|old|swp|map|gz|tgz|zip|tar|pem|key|crt|ya?ml|conf|sh|py|rb)$ {
            return 404;
        }
    }

    # 入口 HTML 不缓存，发版后立刻拿到新的资源引用
    location = /julai/index.html {
        root /var/www;
        expires -1;
    }

    # SPA 回退（应用本身用 hash 路由，回退主要防止误拼路径 404）
    location /julai/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /julai/index.html;
    }
